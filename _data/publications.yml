# Publication list — single source for both the home page and /publications/.
#
# Newest first. One entry per paper:
#   title     paper title (linked to `url`)
#   url       abstract / landing page
#   authors   plain text; "Yige Yuan" is bolded automatically, keep * for equal contribution
#   venue     short venue shown in the venue line, e.g. "NeurIPS 2025"
#   award     optional highlight next to the venue, e.g. "Oral"
#   year      group heading on /publications/
#   image     thumbnail under /resources/ (optional; a grey tile is shown without one)
#   selected  true -> also shown under "Selected Publications" on the home page
#   summary   one-paragraph description (home page)
#   details   list of extra lines (venue full name, location, track) shown on /publications/
#   links     buttons, in order; leave out the ones that do not exist yet

- title: "Infrathon: Benchmarking Language Agents for Real-World, Long-Horizon AI Infra Optimization"
  url: "https://arxiv.org/abs/2611.11995"
  authors: "Zhengyu Hu, Zheyuan Xiao, Yike Wang, Hamish Ivison, Haoyu Wang, Yige Yuan, Rulin Shao, Yuetai Li, Niqi Lyu, Yicheng Ding, Shu Yang, Zhichen Zeng, Banghua Zhu, Jiaxin Pei, Kaize Ding, Pradeep Dasigi, Dan Roth, Hannaneh Hajishirzi, Noah A. Smith, Teng Xiao, Radha Poovendran"
  venue: "arXiv"
  year: 2026
  image: "/resources/infrathon-pic.png"
  selected: true
  summary: "We study whether frontier agents can continually improve real-world AI infrastructure over long horizons and introduce Infrathon, a benchmark of diverse, long-horizon AI infrastructure optimization tasks. Across 150 runs with 24-hour budgets, model rankings vary with the evaluation horizon and 135 runs keep improving in the second half of their budgets, while agents can discover solutions that outperform human-designed baselines."
  details:
    - "arXiv preprint arXiv:2611.11995"
  links:
    - name: "Paper"
      url: "https://arxiv.org/pdf/2611.11995"
    - name: "Website"
      url: "https://infrathonx.github.io/site/"
    - name: "Code"
      url: "https://github.com/InfrathonX/Infrathon"

