- title: "SimPER: A Minimalist Approach to Preference Alignment without Hyperparameters"
  url: "https://arxiv.org/abs/2502.00883"
  authors: "Teng Xiao*, Yige Yuan*, Zhengyu Chen, Mingxiao Li, Shangsong Liang, Zhaochun Ren, Vasant G Honavar"
  venue: "ICLR 2025"
  year: 2025
  image: "/resources/iclr2025-simper-pic.png"
  selected: true
  summary: "We propose SimPER, a simple yet effective hyperparameter-free alignment method that optimizes inverse perplexity. This lightweight objective eliminates the need for costly hyperparameter tuning and reference models, while theoretically optimizing total variation distance (TVD) and mitigating likelihood displacement issues."
  details:
    - "The Thirteenth International Conference on Learning Representations (ICLR 2025)"
    - "Singapore EXPO"
