- title: "Incentivizing Strong Reasoning from Weak Supervision"
  url: "https://arxiv.org/abs/2505.20072"
  authors: "Yige Yuan*, Teng Xiao*, Shuchang Tao, Xue Wang, Jinyang Gao, Bolin Ding, Bingbing Xu"
  venue: "EACL 2026"
  award: "Oral"
  year: 2026
  image: "/resources/w2sr-pic.png"
  selected: true
  summary: "We study the problem of incentivizing reasoning of LLMs from weak supervision, and find that weak reasoner teachers—4.7× smaller and 31.5% less performant than the student—can boost student reasoning by 56.25% without expert supervision or costly RL."
  details:
    - "Conference of the European Chapter of the Association for Computational Linguistics (EACL 2026)"
