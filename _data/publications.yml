- title: "On a Connection Between Imitation Learning and RLHF"
  url: "https://openreview.net/forum?id=2QdsjiNXgj"
  authors: "Teng Xiao, Yige Yuan, Mingxiao Li, Zhengyu Chen, Vasant G Honavar"
  venue: "ICLR 2025"
  year: 2025
  image: "/resources/iclr2025-dil-pic.png"
  selected: true
  summary: "This work reveals that RLHF is barely RL and secretly performs imitation learning (IL) and propose DIL, a principled framework that directly optimizes IL. DIL unifies existing alignment methods as special cases while enabling new variants, offering fresh insights into alignment through the lens of imitation learning."
