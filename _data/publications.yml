- title: "Rethinking the Evaluation of Harness Evolution for Agents"
  url: "https://arxiv.org/abs/2607.12227"
  authors: "Yike Wang, Huaisheng Zhu, Zhengyu Hu, Yige Yuan, Zhengyu Chen, Shakti Senthil, Hannaneh Hajishirzi, Yulia Tsvetkov, Noah A. Smith, Pradeep Dasigi, Teng Xiao"
  venue: "arXiv"
  year: 2026
  image: "/resources/harness-eval-pic.png"
  selected: true
  summary: "We revisit the evaluation of automatic harness evolution for LLM agents and identify two issues in the protocol: missing matched-budget comparisons with simple task-level search, and no separation between the tasks used for search and for reporting. Under matched budgets and held-out evaluation, harness evolution fails to outperform simple test-time scaling on Terminal-Bench 2.1, yet improves over the search baseline by 80% on ARC-AGI-3."
  details:
    - "arXiv preprint arXiv:2607.12227"
  links:
    - name: "Paper"
      url: "https://arxiv.org/pdf/2607.12227"
    - name: "Code"
      url: "https://github.com/rethinking-harness-evolution"

- title: "Meta-Reinforcement Learning with Self-Reflection for Agentic Search"
  url: "https://arxiv.org/abs/2603.11327"
  authors: "Teng Xiao*, Yige Yuan*, Hamish Ivison, Huaisheng Zhu, Faeze Brahman, Nathan Lambert, Pradeep Dasigi, Noah A. Smith, Hannaneh Hajishirzi"
  venue: "COLM 2026"
  year: 2026
  image: "/resources/mrsearch-pic.png"
  selected: true
  summary: "We introduce MR-Search, an in-context meta reinforcement learning formulation for agentic search with self-reflection. Instead of optimizing within a single independent episode, MR-Search trains a policy that conditions on past episodes and their self-reflections to adapt its search strategy at test time, with a multi-turn RL algorithm for turn-level credit assignment, yielding relative improvements of 9.2% to 19.3% across eight benchmarks."
  details:
    - "Conference on Language Modeling (COLM 2026)"
  links:
    - name: "Paper"
      url: "https://arxiv.org/pdf/2603.11327"
    - name: "Code"
      url: "https://github.com/tengxiao1/MR-Search"

